name: App isolation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=tests python -m unittest -v progress_cards_test locked_card_test multiplication_test positive_coin_reward_test app_isolation_test app_version_test mobile_regression_test quiz_prompt_test table_coin_reward_test admin_report_test kuku_chart_test multiplication_exam_test
      - run: python scripts/check_static.py
